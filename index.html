*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:calc(12px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

.shell{max-width:720px;margin:0 auto}
h1{font:600 26px/1.15 Georgia,"Times New Roman",serif;margin:4px 0 12px}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;margin-bottom:12px}
nav button{flex:none;padding:9px 16px;border-radius:999px;font-weight:600;white-space:nowrap}
nav button[aria-current]{background:var(--btn);color:var(--btn-ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
details{margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 14px}
summary{cursor:pointer;font-weight:700;padding:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:12px 20px;font-weight:700}
.btn.p{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.q{text-align:center;padding:18px 6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.big{font:500 clamp(32px,10vw,54px)/1.1 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
.sg{color:var(--sg);font-weight:700}
.sm{color:var(--mute);font-size:13px}.pron{color:var(--acc);font-weight:600}
.win{width:100%;font:500 26px Georgia,serif;padding:13px 18px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);text-align:center;margin-bottom:12px}
.fb{margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px}.fb.no{border:1px dashed var(--acc)}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 16px;text-align:left;overflow-wrap:anywhere}
.opt.ok{background:var(--btn);color:var(--btn-ink)}.opt.bad{border-style:dashed;text-decoration:line-through;opacity:.7}
.opt.ok::before{content:"✓ doğru cevap";display:block;font-size:11px;font-weight:700}.opt.bad::before{content:"✗ senin cevabın";display:block;font-size:11px;font-weight:700;text-decoration:none}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}.prog b{display:block;height:100%;background:var(--acc)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin:10px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px 10px;text-align:left;border-top:1px solid var(--line);font-size:14px}
th{border-top:0;background:var(--btn);color:var(--btn-ink);font-size:12px}
td.r{font:600 19px Georgia,serif}td.p{color:var(--acc);font-weight:600}
input[type=search]{width:100%;font:inherit;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);margin-bottom:10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:flex;flex-direction:column;gap:10px}
.m{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;min-height:62px;text-align:center;overflow-wrap:anywhere;font-weight:500}
.nh{font:700 12px system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:14px 0 4px}.nl{margin:0;padding-left:18px}.nl li{margin:5px 0;overflow-wrap:anywhere}
.lt{display:inline-block;min-width:34px;padding:4px 6px;margin:2px;border-radius:8px;border:1px solid var(--line);text-align:center;font:600 18px Georgia,serif}.lt.g{background:var(--btn);color:var(--btn-ink)}.lt.b{border:1px dashed var(--acc)}
.m.sel{background:var(--btn);color:var(--btn-ink)}.m.done{opacity:.3;text-decoration:line-through;pointer-events:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/\u0301/g,'').replace(/ё/g,'е').replace(/\([^)]*\)/g,' ').replace(/[?!.,;:«»"]/g,'').replace(/\s+/g,' ').trim();
const ru=s=>esc(s).replace(/[ьъЬЪ]/g,m=>`<span class="sg">${m}</span>`);
const lc=s=>s.toLocaleLowerCase('tr');
const WORDS=[];let cc=null;
RAW.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#'){cc=l.slice(1);return}const p=l.split('|');if(p.length>=3)WORDS.push({ru:p[0],pr:p[1],tr:p[2],c:cc})});
const TABS=[['write','Yazma'],['exam','Sınav'],['cards','Kartlar'],['test','Test'],['match','Eşleştirme'],['alpha','Alfabe'],['notes','Notlar'],['list','Liste']];
const sel=new Set(CATS.map(c=>c.id));let mode='write';
try{const s=JSON.parse(localStorage.getItem('rk5')||'{}');if(TABS.some(t=>t[0]===s.mode))mode=s.mode;if(Array.isArray(s.sel)&&s.sel.length){sel.clear();s.sel.forEach(x=>sel.add(x))}}catch(e){}
const save=()=>{try{localStorage.setItem('rk5',JSON.stringify({mode,sel:[...sel]}))}catch(e){}};
const pool=()=>{const seen=new Set();return WORDS.filter(w=>sel.has(w.c)).filter(w=>{const k=lc(w.tr)+'|'+norm(w.ru);if(seen.has(k))return false;seen.add(k);return true})};
const answers=w=>{const s=new Set();WORDS.filter(x=>lc(x.tr)===lc(w.tr)).forEach(x=>{s.add(norm(x.ru));x.ru.split('/').forEach(p=>s.add(norm(p)))});s.delete('');return s};

$('#nav').innerHTML=TABS.map(t=>`<button data-m="${t[0]}">${t[1]}</button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){mode=b.dataset.m;save();start();scrollTo(0,0)}};
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c){sel.has(b.dataset.c)?sel.delete(b.dataset.c):sel.add(b.dataset.c)}
  else{const g=b.dataset.all||b.dataset.none;CATS.filter(c=>c.g===g).forEach(c=>b.dataset.all?sel.add(c.id):sel.delete(c.id))}
  save();start()};
function chips(){
  const op=$('#filter').open;
  $('#chips').innerHTML=[...new Set(CATS.map(c=>c.g))].map(g=>`<div class="sm">${esc(g)} · <button data-all="${esc(g)}"><u>hepsi</u></button> <button data-none="${esc(g)}"><u>hiçbiri</u></button></div><div class="chips">`+
    CATS.filter(c=>c.g===g).map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${sel.has(c.id)}">${esc(c.n)}</button>`).join('')+'</div>').join('');
  $('#cnt').textContent='· '+pool().length+' kelime';$('#filter').open=op;
}
function start(){
  document.querySelectorAll('#nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.m===mode));
  chips();const nf=['alpha','notes','exam'].includes(mode);$('#filter').hidden=nf;
  if(!nf&&!pool().length){$('#stage').innerHTML='<p class="sm">Önce en az bir konu seç.</p>';return}
  ({write:writeInit,cards:cardsInit,test:testInit,match:matchInit,alpha:alphaInit,notes:notesInit,exam:examInit,list:listInit})[mode]();
}

/* ---- YAZMA ---- */
let W;
function writeInit(){const q=shuffle(pool()).map(w=>({w,need:1,miss:false}));W={q,total:q.length,learned:0,tries:0,right:0,state:'ask',shown:q[0],given:''};writeDraw()}
function writeJudge(t){
  const cur=W.shown,ok=t!==null&&answers(cur.w).has(norm(t));W.tries++;W.q.shift();
  if(ok){W.right++;cur.need--;if(cur.need>0)W.q.splice(Math.min(5,W.q.length),0,cur);else W.learned++;W.state='right'}
  else{cur.need=2;cur.miss=true;W.q.splice(Math.min(3,W.q.length),0,cur);W.state='wrong';W.given=t||''}
  writeDraw()}
function writeNext(){W.state='ask';W.shown=W.q[0];writeDraw()}
function writeDraw(){
  const st=$('#stage');
  if(!W.shown){st.innerHTML=`<div class="q"><div class="big">Hepsini öğrendin</div><p>${W.total} kelime · ${W.right} doğru, ${W.tries-W.right} yanlış cevap</p><button class="btn p" id="again">Yeniden başla</button></div>`;$('#again').onclick=writeInit;return}
  const cur=W.shown,w=cur.w,cat=CATS.find(c=>c.id===w.c);
  const head=`<div class="prog"><b style="width:${W.learned/W.total*100}%"></b></div><div class="meta"><span>${W.learned}/${W.total} öğrenildi · ${W.q.length} kaldı</span><span>Doğru ${W.right} · Yanlış ${W.tries-W.right}</span></div>`;
  const prompt=`<div class="q"><div class="sm">Rusçası nedir?</div><div class="big">${esc(w.tr)}</div>${cat?`<div class="sm">${esc(cat.n)}</div>`:''}${cur.miss&&W.state==='ask'?'<div class="sm">Tekrar: bunu daha önce yanlış yaptın</div>':''}</div>`;
  const inp=(id,ph)=>`<input class="win" id="${id}" lang="ru" placeholder="${ph}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
  if(W.state==='ask'){
    st.innerHTML=head+prompt+inp('ans','Rusçasını yaz')+`<div class="row"><button class="btn" id="skip">Bilmiyorum</button><button class="btn p" id="chk">Kontrol et</button></div><p class="sm" style="margin-top:12px">ё yerine е yazabilirsin, vurgu işareti gerekmez.</p>`;
    const a=$('#ans');setTimeout(()=>a.focus(),30);
    a.onkeydown=e=>{if(e.key==='Enter'&&a.value.trim())writeJudge(a.value)};
    $('#chk').onclick=()=>{a.value.trim()?writeJudge(a.value):a.focus()};
    $('#skip').onclick=()=>writeJudge(null);
  }else if(W.state==='right'){
    st.innerHTML=head+prompt+`<div class="fb"><b>✓ Doğru.</b> ${ru(w.ru)} (${esc(w.pr)}) = ${esc(w.tr)}</div><button class="btn p" id="next" style="width:100%">Sonraki</button>`;
    $('#next').onclick=writeNext;$('#next').focus();
  }else{
    st.innerHTML=head+prompt+`<div class="fb no"><b>✗ Yanlış.</b> ${W.given?'Senin cevabın: '+esc(W.given)+'<br>':''}Doğrusu: <b>${ru(w.ru)}</b> (${esc(w.pr)})</div><p class="sm">Doğrusunu yazarak devam et. Bu kelime birazdan tekrar gelecek.</p>`+inp('fix','Doğrusunu yaz')+`<button class="btn p" id="go" style="width:100%">Devam</button>`;
    const f=$('#fix');setTimeout(()=>f.focus(),30);
    const go=()=>{if(answers(w).has(norm(f.value)))writeNext();else{f.value='';f.placeholder='Tam olarak doğrusunu yaz';f.focus()}};
    f.onkeydown=e=>{if(e.key==='Enter')go()};$('#go').onclick=go;
  }
}

let C;
function cardsInit(){const d=shuffle(pool());C={d,total:d.length,known:0,flip:false};cardsDraw()}
function cardsDraw(){
  const st=$('#stage');
  if(!C.d.length){st.innerHTML=`<div class="q"><div class="big">Deste bitti</div><button class="btn p" id="again">Yeniden başla</button></div>`;$('#again').onclick=cardsInit;return}
  const w=C.d[0];
  st.innerHTML=`<div class="prog"><b style="width:${C.known/C.total*100}%"></b></div><div class="meta"><span>${C.known} bildim</span><span>${C.d.length} kaldı</span></div>
  <button class="q" id="card" style="width:100%;min-height:220px;justify-content:center;border:1px solid var(--line);border-radius:18px;margin-bottom:12px">${C.flip?`<div class="big">${esc(w.tr)}</div><div class="pron">${esc(w.pr)}</div>`:`<div class="big">${ru(w.ru)}</div><div class="pron">${esc(w.pr)}</div><div class="sm">çevirmek için dokun</div>`}</button>
  <div class="row"><button class="btn" id="no">Bilmedim</button><button class="btn p" id="yes">Bildim</button></div>`;
  $('#card').onclick=()=>{C.flip=!C.flip;cardsDraw()};
  $('#yes').onclick=()=>{C.d.shift();C.known++;C.flip=false;cardsDraw()};
  $('#no').onclick=()=>{C.d.push(C.d.shift());C.flip=false;cardsDraw()};
}

/* ---- TEST ---- */
let T;
function testInit(){
  const qs=shuffle(pool()).slice(0,20).map(w=>{const toRu=Math.random()<.5,key=toRu?'ru':'tr',opts=[w];
    for(const x of shuffle(WORDS)){if(opts.length>=4)break;if(lc(x.tr)!==lc(w.tr)&&!opts.some(o=>norm(o[key])===norm(x[key])))opts.push(x)}
    return{w,toRu,opts:shuffle(opts),wrong:false}});
  runTest(qs);
}
function runTest(qs){T={qs,i:0,score:0,a:null,wrong:[]};testDraw()}
function testDraw(){
  const st=$('#stage');
  if(T.i>=T.qs.length){st.innerHTML=`<div class="q"><div class="big">${T.score}/${T.qs.length}</div>${T.wrong.length?`<div class="tw" style="width:100%"><table>${T.wrong.map(q=>`<tr><td class="r">${ru(q.w.ru)}</td><td>${esc(q.w.pr)} · ${esc(q.w.tr)}</td></tr>`).join('')}</table></div>`:''}
    <div class="row" style="width:100%">${T.wrong.length?'<button class="btn" id="redo">Yanlışları tekrar et</button>':''}<button class="btn p" id="again">Yeni test</button></div></div>`;
    const r=$('#redo');if(r)r.onclick=()=>runTest(T.wrong.slice());$('#again').onclick=testInit;return}
  const q=T.qs[T.i],a=T.a,ask=q.toRu?'tr':'ru',ans=q.toRu?'ru':'tr';
  st.innerHTML=`<div class="prog"><b style="width:${T.i/T.qs.length*100}%"></b></div><div class="meta"><span>Soru ${T.i+1}/${T.qs.length}</span><span>Skor ${T.score}</span></div>
  <div class="q"><div class="big">${ask==='ru'?ru(q.w[ask]):esc(q.w[ask])}</div>${q.toRu?'':`<div class="pron">${esc(q.w.pr)}</div>`}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt${a!==null?(o===q.w?' ok':k===a?' bad':''):''}" data-k="${k}" ${a!==null?'disabled':''}>${ans==='ru'?ru(o[ans]):esc(o[ans])}</button>`).join('')}</div>
  ${a!==null?`<div class="fb"><b>${q.opts[a]===q.w?'✓ Doğru.':'✗ Yanlış.'}</b> ${ru(q.w.ru)} (${esc(q.w.pr)}) = ${esc(q.w.tr)}</div><button class="btn p" id="next" style="width:100%">Sonraki</button>`:''}`;
  st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(T.a!==null)return;T.a=+b.dataset.k;if(q.opts[T.a]===q.w)T.score++;else T.wrong.push(q);testDraw()});
  const n=$('#next');if(n){n.onclick=()=>{T.i++;T.a=null;testDraw()};n.focus()}
}

let M;
function matchInit(){
  const sr=new Set(),stt=new Set();
  const list=shuffle(pool()).filter(w=>{const t=lc(w.tr);if(sr.has(w.ru)||stt.has(t))return false;sr.add(w.ru);stt.add(t);return true});
  M={list,r:0,mis:0,total:0};matchRound();
}
function matchRound(){
  const part=M.list.slice(M.r*6,M.r*6+6);
  if(!part.length){$('#stage').innerHTML=`<div class="q"><div class="big">Hepsi eşleşti</div><p>${M.total} kelime · ${M.mis} hata</p><button class="btn p" id="again">Yeniden oyna</button></div>`;$('#again').onclick=matchInit;return}
  M.part=part;M.L=shuffle(part);M.R=shuffle(part);M.ok=new Set();M.pick=null;matchDraw();
}
function matchDraw(){
  const rounds=Math.ceil(M.list.length/6),pk=(s,i)=>M.pick&&M.pick.s===s&&M.pick.i===i?' sel':'';
  const L=M.L.map((w,i)=>`<button class="m${M.ok.has(w)?' done':''}${pk('l',i)}" data-s="l" data-i="${i}"><b>${ru(w.ru)}</b><br><span class="sm">${esc(w.pr)}</span></button>`).join('');
  const R=M.R.map((w,i)=>`<button class="m${M.ok.has(w)?' done':''}${pk('r',i)}" data-s="r" data-i="${i}">${esc(w.tr)}</button>`).join('');
  $('#stage').innerHTML=`<div class="prog"><b style="width:${M.r/rounds*100}%"></b></div><div class="meta"><span>Tur ${M.r+1}/${rounds}</span><span>Hata ${M.mis}</span></div>
  <p class="sm">Soldaki Rusça kelimeyi sağdaki Türkçe karşılığıyla eşleştir.</p><div class="mgrid"><div class="mcol">${L}</div><div class="mcol">${R}</div></div>`;
  $('#stage').querySelectorAll('.m').forEach(b=>b.onclick=()=>matchTap(b.dataset.s,+b.dataset.i));
}
function matchTap(s,i){
  if(!M.pick||M.pick.s===s){M.pick={s,i};matchDraw();return}
  const l=s==='l'?i:M.pick.i,r=s==='r'?i:M.pick.i;M.pick=null;
  if(M.L[l]===M.R[r]){M.ok.add(M.L[l]);if(M.ok.size===M.part.length){M.total+=M.part.length;matchDraw();setTimeout(()=>{M.r++;matchRound()},500);return}}
  else M.mis++;
  matchDraw();
}

let AV='table',AQ;
function alphaInit(){
  $('#stage').innerHTML=`<div class="chips" id="asub">${[['table','Tablo'],['sound','Harf testi'],['order','Sıra testi'],['write','Alfabeyi yaz']].map(v=>`<button class="chip" data-v="${v[0]}" aria-pressed="${AV===v[0]}">${v[1]}</button>`).join('')}</div><div id="av"></div>`;
  $('#asub').onclick=e=>{const b=e.target.closest('button');if(b){AV=b.dataset.v;alphaInit()}};
  ({table:alTable,sound:()=>alphaMc(alSound(),alSound),order:()=>alphaMc(alOrder(),alOrder),write:alWrite})[AV]();
}
function alTable(){
  $('#av').innerHTML=`<div class="fb">Sıra ve adlar kitaptaki Русский алфавит tablosuna göredir. 33 harf: 10 ünlü (а я э е о ё у ю ы и), 21 ünsüz ve 2 işaret (ъ ь). İşaretlerin sesi yoktur.</div>
  <div class="tw"><table><thead><tr><th>#</th><th>Harf</th><th>Adı</th><th>Latin (kitap)</th><th>Türkçe karşılığı</th><th>Örnek</th></tr></thead><tbody>${LET.map((L,i)=>`<tr><td>${i+1}</td><td class="r">${LB(L)}</td><td class="r">${ru(L.name)}</td><td>${esc(L.lat)}</td><td class="p">${esc(L.snd)}</td><td>${ru(L.ex)} <span class="sm">${esc(L.expr)}</span></td></tr>`).join('')}</tbody></table></div>`;
}
function alSound(){
  return shuffle(LET).slice(0,20).map(L=>{
    const t=Math.floor(Math.random()*3),key=t===1?'snd':t===2?'lat':'snd',opts=[L];
    for(const x of shuffle(LET)){if(opts.length>=4)break;if(!opts.some(o=>o[key]===x[key]))opts.push(x)}
    const p=t===0?`<div class="sm">Türkçe karşılığı nedir?</div><div class="big">${LB(L)}</div>`
      :t===1?`<div class="sm">Hangi harf?</div><div class="big">${esc(L.snd)}</div>`
      :`<div class="sm">Kitaptaki Latin yazılışı nedir?</div><div class="big">${LB(L)}</div>`;
    return{p,o:shuffle(opts).map(o=>({ok:o===L,h:t===0?esc(o.snd):t===1?LB(o):esc(o.lat)})),
      e:`${LB(L)} = ${esc(L.snd)}. Kitapta Latin yazılışı: ${esc(L.lat)}, adı: ${ru(L.name)}. Örnek: ${ru(L.ex)} (${esc(L.expr)})`};
  });
}
function alOrder(){
  const N=LET.length,all=[...Array(N).keys()];
  return shuffle(all).slice(0,20).map(i=>{
    let t=['next','prev','miss'][Math.floor(Math.random()*3)];
    if(t==='next'&&i===N-1)t='prev';if(t==='prev'&&i===0)t='next';
    const s=Math.min(Math.max(i-2,0),N-5),win=t==='miss'?[0,1,2,3,4].map(k=>s+k):[];
    const ans=t==='next'?i+1:t==='prev'?i-1:i;
    const dis=shuffle(all.filter(k=>k!==ans&&k!==i&&!win.includes(k))).slice(0,3);
    const p=t==='miss'?`<div class="sm">Eksik harf hangisi?</div><div class="big">${win.map(k=>k===i?'?':LU(k)).join(' ')}</div>`
      :`<div class="sm">Bu harften ${t==='next'?'sonra':'önce'} hangi harf gelir?</div><div class="big">${LU(i)}</div>`;
    return{p,o:shuffle([ans,...dis]).map(k=>({ok:k===ans,h:LU(k)})),e:`Doğru sıra: ${nb(ans)}`};
  });
}
function alphaMc(qs,again){AQ={qs,again,i:0,score:0,a:null,wrong:[]};alphaMcDraw()}
function alphaMcDraw(){
  const av=$('#av');
  if(AQ.i>=AQ.qs.length){
    av.innerHTML=`<div class="q"><div class="big">${AQ.score}/${AQ.qs.length}</div>${AQ.wrong.length?`<div class="tw" style="width:100%"><table>${AQ.wrong.map(q=>`<tr><td>${q.e}</td></tr>`).join('')}</table></div>`:''}<div class="row" style="width:100%">${AQ.wrong.length?'<button class="btn" id="redo">Yanlışları tekrar et</button>':''}<button class="btn p" id="again">Yeni test</button></div></div>`;
    const r=$('#redo');if(r)r.onclick=()=>alphaMc(AQ.wrong.slice(),AQ.again);
    $('#again').onclick=()=>alphaMc(AQ.again(),AQ.again);return}
  const q=AQ.qs[AQ.i],a=AQ.a;
  av.innerHTML=`<div class="prog"><b style="width:${AQ.i/AQ.qs.length*100}%"></b></div><div class="meta"><span>Soru ${AQ.i+1}/${AQ.qs.length}</span><span>Skor ${AQ.score}</span></div>
  <div class="q">${q.p}</div>
  <div class="opts">${q.o.map((o,k)=>`<button class="opt${a!==null?(o.ok?' ok':k===a?' bad':''):''}" data-k="${k}" ${a!==null?'disabled':''}>${o.h}</button>`).join('')}</div>
  ${a!==null?`<div class="fb"><b>${q.o[a].ok?'✓ Doğru.':'✗ Yanlış.'}</b> ${q.e}</div><button class="btn p" id="next" style="width:100%">Sonraki</button>`:''}`;
  av.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(AQ.a!==null)return;AQ.a=+b.dataset.k;if(q.o[AQ.a].ok)AQ.score++;else AQ.wrong.push(q);alphaMcDraw()});
  const n=$('#next');if(n){n.onclick=()=>{AQ.i++;AQ.a=null;alphaMcDraw()};n.focus()}
}
function alWrite(){
  $('#av').innerHTML=`<p>Alfabeyi baştan sona, 33 harfi sırayla yaz. Boşluklu ya da boşluksuz olur, büyük küçük fark etmez.</p>
  <textarea class="win" id="aw" rows="3" lang="ru" placeholder="а б в г…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="border-radius:20px;font-size:22px"></textarea>
  <div class="row"><button class="btn" id="peek">Sırayı göster</button><button class="btn p" id="chk">Kontrol et</button></div><div id="res"></div>`;
  const chip=(c,k)=>`<span class="lt ${k}">${ru(c)}</span>`,right=LET.map(L=>L.l);
  $('#peek').onclick=()=>{$('#res').innerHTML=`<div class="fb">${right.map(c=>chip(c,'')).join('')}</div>`};
  $('#chk').onclick=()=>{
    const t=Array.from($('#aw').value.toLowerCase().replace(/[\s,.\-]/g,''));
    if(!t.length){$('#aw').focus();return}
    const bad=t.findIndex((c,i)=>c!==right[i]),miss=right.filter(c=>!t.includes(c));
    let msg;
    if(bad===-1&&t.length===right.length)msg='<b>Mükemmel!</b> 33/33 doğru.';
    else if(bad===-1)msg=`<b>Şu ana kadar hepsi doğru</b> ama ${right.length-t.length} harf eksik. İlk eksik: ${ru(right[t.length])} (${t.length+1}. harf).`;
    else msg=`<b>${bad+1}. harfte hata:</b> sen ${ru(t[bad])} yazdın, doğrusu ${ru(right[bad])}. Doğru yazdığın ilk ${bad} harf var.`;
    $('#res').innerHTML=`<div class="fb ${bad===-1&&t.length===right.length?'':'no'}">${msg}</div><div class="fb">${t.map((c,i)=>chip(c,c===right[i]?'g':'b')).join('')}</div>${miss.length?`<div class="sm">Hiç yazmadığın harfler: ${miss.map(c=>ru(c)).join(' ')}</div>`:''}`;
  };
}

const NOTES=[];
NRAW.split('\n').forEach(l=>{l=l.trim();if(!l)return;
  if(l.startsWith('##'))NOTES[NOTES.length-1].pages.push({t:l.slice(2).trim(),secs:[]});
  else if(l[0]==='#')NOTES.push({t:l.slice(1).trim(),pages:[]});
  else if(l[0]==='@'){const ps=NOTES[NOTES.length-1].pages;ps[ps.length-1].secs.push({h:l.slice(1).trim(),items:[]})}
  else{const ps=NOTES[NOTES.length-1].pages,ss=ps[ps.length-1].secs,it=ss[ss.length-1].items,i=l.indexOf(' :: ');it.push(i>0?{l:l.slice(0,i),t:l.slice(i+4)}:{l:'',t:l})}});
let NL=0,NQ='';
function notesInit(){
  $('#stage').innerHTML=`<div class="chips" id="nsub">${NOTES.map((n,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===NL}">${esc(n.t)}</button>`).join('')}</div>
  <input type="search" id="nq" placeholder="Notlarda ara (Rusça veya Türkçe)" autocomplete="off" value="${esc(NQ)}"><div id="nbody"></div>`;
  $('#nsub').onclick=e=>{const b=e.target.closest('button');if(b){NL=+b.dataset.i;NQ='';notesInit()}};
  $('#nq').oninput=e=>{NQ=e.target.value;notesDraw()};
  notesDraw();
}
function notesDraw(){
  const q=lc(NQ.trim()),src=q?NOTES.flatMap(n=>n.pages.map(p=>[n,p])):NOTES[NL].pages.map(p=>[NOTES[NL],p]);
  const html=src.map(([n,p],k)=>{
    const secs=p.secs.map(s=>({h:s.h,items:q?s.items.filter(x=>lc(x.l+' '+x.t).includes(q)):s.items})).filter(s=>s.items.length);
    if(!secs.length)return '';
    return `<details ${q||k===0?'open':''}><summary>${q?esc(n.t)+' · ':''}${esc(p.t)}</summary>${secs.map(s=>`<div class="nh">${esc(s.h)}</div><ul class="nl">${s.items.map(x=>`<li>${x.l?`<b>${ru(x.l)}</b> · `:''}${ru(x.t)}</li>`).join('')}</ul>`).join('')}</details>`;
  }).join('');
  $('#nbody').innerHTML=html||'<p class="sm">Sonuç yok.</p>';
}

/* ---- SINAV ---- */
const V1=[['знать','bilmek'],['читать','okumak'],['делать','yapmak'],['изучать','öğrenmek'],['играть','oynamak'],['слушать','dinlemek'],['думать','düşünmek'],['понимать','anlamak'],['работать','çalışmak'],['отдыхать','dinlenmek'],['гулять','gezmek'],['спрашивать','sormak'],['отвечать','cevaplamak'],['завтракать','kahvaltı yapmak'],['обедать','öğle yemeği yemek'],['ужинать','akşam yemeği yemek'],['плавать','yüzmek'],['повторять','tekrarlamak']];
const V2={'говорить':['konuşmak','говорю','говоришь','говорит','говорим','говорите','говорят'],'смотреть':['izlemek','смотрю','смотришь','смотрит','смотрим','смотрите','смотрят'],'курить':['sigara içmek','курю','куришь','курит','курим','курите','курят'],'любить':['sevmek','люблю','любишь','любит','любим','любите','любят'],'помнить':['hatırlamak','помню','помнишь','помнит','помним','помните','помнят']};
const PERS=['я','ты','он / она','мы','вы','они'];
const VERBS=V1.map(v=>{const st=v[0].slice(0,-2);return{inf:v[0],tr:v[1],f:[st+'ю',st+'ешь',st+'ет',st+'ем',st+'ете',st+'ют']}}).concat(Object.keys(V2).map(k=>({inf:k,tr:V2[k][0],f:V2[k].slice(1)})));
const PLP=[['сад','сады'],['гид','гиды'],['город','города'],['клуб','клубы'],['раб','рабы'],['гриб','грибы'],['флаг','флаги'],['враг','враги'],['блог','блоги'],['глаз','глаза'],['рассказ','рассказы'],['круиз','круизы'],['сумка','сумки'],['книга','книги'],['дух','духи'],['турист','туристы'],['роза','розы'],['кошка','кошки'],['слово','слова'],['магазин','магазины'],['отель','отели'],['парк','парки'],['врач','врачи'],['машина','машины'],['семья','семьи'],['девушка','девушки'],['море','моря'],['друг','друзья'],['человек','люди'],['ребёнок','дети'],['дом','дома'],['дерево','деревья'],['стул','стулья'],['отец','отцы'],['мать','матери'],['сын','сыновья'],['дочь','дочери'],['брат','братья'],['сестра','сёстры'],['муж','мужья'],['жена','жёны']];
const ACC=[['меня','beni'],['тебя','seni'],['его','onu (erkek)'],['её','onu (kadın)'],['нас','bizi'],['вас','sizi'],['их','onları']];
const UKO=[['у меня','benim'],['у тебя','senin'],['у него','onun (erkek)'],['у неё','onun (kadın)'],['у нас','bizim'],['у вас','sizin'],['у них','onların']];
const POSS=[['benim',['мой','моя','моё','мои']],['senin',['твой','твоя','твоё','твои']],['bizim',['наш','наша','наше','наши']],['sizin',['ваш','ваша','ваше','ваши']]];
const PN=[['брат',0],['дом',0],['стол',0],['друг',0],['сестра',1],['сумка',1],['машина',1],['книга',1],['семья',1],['письмо',2],['окно',2],['место',2],['друзья',3],['деньги',3],['ключи',3],['документы',3]];
const CHEJ=[['книга',1],['дом',0],['письмо',2],['ключи',3],['документы',3],['фотография',1],['место',2],['компьютер',0],['вещи',3]];
const TJ=[['— Я люблю тебя! — Я ___ тебя люблю!',0],['— Я говорю по-английски. — Я ___ говорю по-английски.',0],['Я говорю по-английски. А ___ я говорю по-русски.',1],['— У вас есть сувениры? — Да, матрёшки. — А что ___ у вас есть?',1],['— Меня зовут Мария. — Правда?! А меня ___!',0],['Кофе, пожалуйста! И ___ десерт!',1],['У меня есть брат. А ___ у меня есть сестра.',1],['— У меня есть деньги. — У меня ___ есть деньги.',0]];
const GEN3=[['он','Eril'],['она','Dişil'],['оно','Nötr']];
const pick=(a,n)=>shuffle(a).slice(0,n);
const mc=(sec,p,right,wrong,e)=>({sec,p,o:shuffle([{ok:true,h:ru(right)}].concat(wrong.map(x=>({ok:false,h:ru(x)})))),e});
function exV(w,toRu){
  const key=toRu?'tr':'ru',opts=[w];
  for(const x of shuffle(WORDS)){if(opts.length>=4)break;if(lc(x.tr)!==lc(w.tr)&&!opts.some(o=>norm(o[key])===norm(x[key])))opts.push(x)}
  return{sec:'Kelime',p:toRu?`<div class="sm">Türkçesi nedir?</div><div class="big">${ru(w.ru)}</div><div class="pron">${esc(w.pr)}</div>`:`<div class="sm">Rusçası nedir?</div><div class="big">${esc(w.tr)}</div>`,
    o:shuffle(opts).map(o=>({ok:o===w,h:toRu?esc(o.tr):ru(o.ru)})),e:`${ru(w.ru)} (${esc(w.pr)}) = ${esc(w.tr)}`};
}
function exT(w){return{sec:'Kelime (yazma)',type:'type',p:`<div class="sm">Rusçasını yaz</div><div class="big">${esc(w.tr)}</div>`,ans:answers(w),show:`${ru(w.ru)} (${esc(w.pr)})`,e:`${ru(w.ru)} (${esc(w.pr)}) = ${esc(w.tr)}`}}
function exGender(){
  const bad=['понедельник','вторник','четверг','воскресенье'],g={a1:0,a2:1,a3:2};
  const ws=WORDS.filter(w=>g[w.c]!==undefined&&!bad.includes(w.ru)&&!w.ru.includes(' ')),out=[];
  pick(ws,4).forEach((w,i)=>{const gi=g[w.c];
    if(i<2)out.push({sec:'Cinsiyet',p:`<div class="sm">Cinsiyeti hangisi?</div><div class="big">${ru(w.ru)}</div><div class="sm">${esc(w.tr)}</div>`,o:GEN3.map((x,k)=>({ok:k===gi,h:x[1]+' ('+x[0]+')'})),e:`${ru(w.ru)} = ${GEN3[gi][1]} (${GEN3[gi][0]})`});
    else out.push({sec:'Cinsiyet',p:`<div class="sm">Boşluğu doldur</div><div class="big">Где ${ru(w.ru)}? — Вот ___.</div><div class="sm">${esc(w.tr)}</div>`,o:GEN3.map((x,k)=>({ok:k===gi,h:x[0]})),e:`${ru(w.ru)} ${GEN3[gi][1].toLowerCase()} olduğu için: Вот ${GEN3[gi][0]}.`});
  });
  return out;
}
function exPlural(){
  return pick(PLP,4).map(([s,p])=>{
    const base=s.replace(/[ьйяаоеё]$/,''),cand=new Set([s+'ы',s+'и',base+'ы',base+'и',base+'а',base+'я',base+'ья']);
    pick(PLP,3).forEach(x=>cand.add(x[1]));cand.delete(p);cand.delete(s);
    return mc('Çoğul',`<div class="sm">Çoğulu hangisi?</div><div class="big">${ru(s)}</div>`,p,pick([...cand],3),`${ru(s)} → ${ru(p)}`);
  });
}
function exVerbs(){
  return pick(VERBS,4).map(v=>{const k=Math.floor(Math.random()*6),w=pick(v.f.filter((x,i)=>i!==k),3);
    return mc('Fiil çekimi',`<div class="sm">«${ru(v.inf)}» (${esc(v.tr)}) fiilini çekimle</div><div class="big">${esc(PERS[k])} ___</div>`,v.f[k],w,`${esc(PERS[k])} ${ru(v.f[k])} (${v.f.map(ru).join(', ')})`)});
}
function exMisc(){
  const out=[];
  pick(ACC,2).forEach(a=>out.push(mc('Zamirler',`<div class="sm">Boşluğa uygun zamir biçimi: O, ${esc(a[1])} tanımıyor.</div><div class="big">Он ___ не знает.</div>`,a[0],pick(ACC.filter(x=>x!==a).map(x=>x[0]),3),`${esc(a[1])} = ${ru(a[0])}. Я ➔ меня, ты ➔ тебя, он ➔ его, она ➔ её, мы ➔ нас, вы ➔ вас, они ➔ их`)));
  const u=pick(UKO,1)[0];out.push(mc('Zamirler',`<div class="sm">«${esc(u[1])} köpeği var»</div><div class="big">___ есть собака.</div>`,u[0],pick(UKO.filter(x=>x!==u).map(x=>x[0]),3),`${ru(u[0])} есть = ${esc(u[1])} var`));
  pick(CHEJ,2).forEach(([n,g])=>{const F=['чей','чья','чьё','чьи'];out.push({sec:'Чей? Чья? Чьё? Чьи?',p:`<div class="sm">Soru zamirini seç</div><div class="big">___ это ${ru(n)}?</div>`,o:F.map((f,k)=>({ok:k===g,h:ru(f)})),e:`${ru(n)} için: ${F[g]}`})});
  pick(TJ,2).forEach(([t,a])=>out.push({sec:'То́же / ещё',p:`<div class="sm">то́же (de, da) mi, ещё (ayrıca, bir de) mi?</div><div class="big" style="font-size:22px">${esc(t)}</div>`,o:[{ok:a===0,h:'то́же'},{ok:a===1,h:'ещё'}],e:`Doğru: ${a===0?'то́же (aynı durum)':'ещё (ekleme)'}`}));
  pick(POSS,2).forEach(([own,F],i)=>{const [n,g]=pick(PN,1)[0];out.push({sec:'İyelik zamirleri',p:`<div class="sm">Boşluğu doldur (${esc(own)})</div><div class="big">Это ___ ${ru(n)}.</div>`,o:F.map((f,k)=>({ok:k===g,h:ru(f)})),e:`${ru(n)} için ${esc(own)}: ${F[g]} (${F.join(' / ')})`})});
  return out;
}
function examBuild(){
  const okW=WORDS.filter(w=>!/[()?]/.test(w.ru)&&!w.ru.includes('/')&&w.ru.length>=3);
  const vm=pick(WORDS.filter(w=>!/[?]/.test(w.ru)),9).map((w,i)=>exV(w,i%2===0));
  const vt=pick(okW,6).map(exT);
  return[].concat(alSound().slice(0,2).map(q=>({...q,sec:'Alfabe'})),alOrder().slice(0,2).map(q=>({...q,sec:'Alfabe (sıra)'})),vm,vt,exGender(),exPlural(),exVerbs(),exMisc());
}
let EX;
function examInit(){
  $('#stage').innerHTML=`<div class="q"><div class="big">Sınav</div><p>40 soru: alfabe, kelime, cinsiyet, çoğul, fiil çekimi, zamirler ve daha fazlası. Her seferinde yeni sorular gelir. Her cevaptan sonra doğrusunu görürsün.</p><button class="btn p" id="go" style="width:100%">Sınavı başlat</button></div>`;
  $('#go').onclick=()=>examRun(examBuild());
}
function examRun(qs){EX={qs,i:0,res:[],done:false,ok:false,pick:null};examDraw()}
function examJudge(x){
  const q=EX.qs[EX.i];
  const ok=q.type==='type'?(x!==null&&q.ans.has(norm(x))):q.o[x].ok;
  EX.done=true;EX.ok=ok;EX.pick=x;EX.res.push({q,ok});examDraw();
}
function examDraw(){
  if(EX.i>=EX.qs.length)return examEnd();
  const st=$('#stage'),q=EX.qs[EX.i],d=EX.done;
  const head=`<div class="prog"><b style="width:${EX.i/EX.qs.length*100}%"></b></div><div class="meta"><span>Soru ${EX.i+1}/${EX.qs.length} · ${esc(q.sec)}</span><span>Doğru ${EX.res.filter(r=>r.ok).length}</span></div>`;
  const fb=`<div class="fb ${EX.ok?'':'no'}"><b>${EX.ok?'✓ Doğru.':'✗ Yanlış.'}</b> `;
  let body;
  if(q.type==='type'){
    body=d?`<div class="q">${q.p}</div>${fb}${EX.pick?'Senin cevabın: '+esc(EX.pick)+'<br>':''}Doğrusu: <b>${q.show}</b></div><button class="btn p" id="xn" style="width:100%">Sonraki</button>`
      :`<div class="q">${q.p}</div><input class="win" id="xa" lang="ru" placeholder="Rusçasını yaz" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="row"><button class="btn" id="xs">Bilmiyorum</button><button class="btn p" id="xc">Kontrol et</button></div>`;
  }else{
    body=`<div class="q">${q.p}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt${d?(o.ok?' ok':k===EX.pick?' bad':''):''}" data-k="${k}" ${d?'disabled':''}>${o.h}</button>`).join('')}</div>${d?`${fb}${q.e}</div><button class="btn p" id="xn" style="width:100%">Sonraki</button>`:''}`;
  }
  st.innerHTML=head+body;
  st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!EX.done)examJudge(+b.dataset.k)});
  const a=$('#xa');if(a){setTimeout(()=>a.focus(),30);a.onkeydown=e=>{if(e.key==='Enter'&&a.value.trim())examJudge(a.value)};$('#xc').onclick=()=>{a.value.trim()?examJudge(a.value):a.focus()};$('#xs').onclick=()=>examJudge(null)}
  const n=$('#xn');if(n){n.onclick=()=>{EX.i++;EX.done=false;EX.pick=null;examDraw()};n.focus()}
}
function examEnd(){
  const n=EX.qs.length,sc=EX.res.filter(r=>r.ok).length,pct=Math.round(sc/n*100),secs={},wrong=EX.res.filter(r=>!r.ok);
  EX.res.forEach(r=>{const s=secs[r.q.sec]||(secs[r.q.sec]=[0,0]);s[1]++;if(r.ok)s[0]++});
  $('#stage').innerHTML=`<div class="q"><div class="big">${sc}/${n}</div><p>%${pct} · ${pct>=85?'Çok iyi, sınava hazırsın':pct>=60?'İyi gidiyorsun, yanlışlarını tekrar et':'Biraz daha çalış, yanlışlarını tekrar et'}</p></div>
  <div class="tw"><table><thead><tr><th>Bölüm</th><th>Doğru</th></tr></thead><tbody>${Object.keys(secs).map(k=>`<tr><td>${esc(k)}</td><td>${secs[k][0]}/${secs[k][1]}</td></tr>`).join('')}</tbody></table></div>
  ${wrong.length?`<div class="nh">Yanlışların</div><div class="tw"><table>${wrong.map(r=>`<tr><td>${r.q.e}</td></tr>`).join('')}</table></div>`:''}
  <div class="row" style="margin-top:12px">${wrong.length?'<button class="btn" id="xr">Yanlışları tekrar et</button>':''}<button class="btn p" id="xnew">Yeni sınav</button></div>`;
  const r=$('#xr');if(r)r.onclick=()=>examRun(wrong.map(x=>x.q));
  $('#xnew').onclick=()=>examRun(examBuild());
}

start();
