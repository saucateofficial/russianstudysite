<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rusça Kelime Atölyesi</title>
<style>
:root{--bg:#e9e1d7;--ink:#2b2723;--mute:#6c635b;--card:rgba(255,255,255,.72);--line:rgba(43,39,35,.15);--btn:#2d2925;--btn-ink:#f6f1ea;--acc:#8b5b37;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#171412;--ink:#f1ebe3;--mute:#b0a69b;--card:rgba(40,35,31,.8);--line:rgba(241,235,227,.16);--btn:#f1ebe3;--btn-ink:#1d1a17;--acc:#e0ac7c;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:max(12px,env(safe-area-inset-top)) 12px 24px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.shell{max-width:760px;margin:0 auto}
h1{font:600 26px/1.1 Georgia,serif;margin:6px 0 12px}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;margin-bottom:12px}
nav button{flex:none;padding:9px 14px;border-radius:999px;font-weight:600;white-space:nowrap}
nav button[aria-current]{background:var(--btn);color:var(--btn-ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
details{margin-bottom:12px}summary{cursor:pointer;font-weight:700;padding:8px 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--btn);color:var(--btn-ink)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:12px 20px;font-weight:700}
.btn.p{background:var(--btn);color:var(--btn-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.q{text-align:center;padding:20px 8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.big{font:500 clamp(32px,10vw,54px)/1.1 Georgia,serif;overflow-wrap:anywhere}
.sm{color:var(--mute);font-size:13px}.pron{color:var(--acc);font-weight:600}
.win{width:100%;font:500 26px Georgia,serif;padding:13px 18px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-align:center;margin-bottom:12px}
.fb{margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:16px}.fb.no{border-style:dashed}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:13px 16px;text-align:left;overflow-wrap:anywhere}
.opt.ok{background:var(--btn);color:var(--btn-ink)}.opt.bad{border-style:dashed;text-decoration:line-through;opacity:.7}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}.prog b{display:block;height:100%;background:var(--btn)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin:10px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px 10px;text-align:left;border-top:1px solid var(--line);font-size:14px}
th{border-top:0;background:var(--btn);color:var(--btn-ink);font-size:12px}
td.r{font:600 19px Georgia,serif}td.p{color:var(--acc);font-weight:600}
input[type=search]{width:100%;font:inherit;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);margin-bottom:10px}
.tip{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
h2{font:500 28px/1.1 Georgia,serif;margin:14px 0 8px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcol{display:flex;flex-direction:column;gap:10px}
.m{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 8px;min-height:62px;text-align:center;overflow-wrap:anywhere;font-weight:500}
.m.sel{background:var(--btn);color:var(--btn-ink)}.m.done{opacity:.3;text-decoration:line-through;pointer-events:none}
</style></head>
<body><div class="shell">
<h1>Рус · Rusça Kelime Atölyesi</h1>
<nav id="nav"></nav>
<details id="filter"><summary>Konular <span class="sm" id="cnt"></span></summary><div id="chips"></div></details>
<main class="box" id="stage">Yükleniyor…</main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/\u0301/g,'').replace(/ё/g,'е').replace(/\([^)]*\)/g,' ').replace(/[?!.,;:«»"]/g,'').replace(/\s+/g,' ').trim();
let WORDS,CATS,RULES,ruleId='',kind='word',mode='write';const sel=new Set();
const TABS=[['write','Yazma'],['cards','Kartlar'],['test','Test'],['match','Eşleştirme'],['rules','Kurallar'],['list','Liste']];
const save=()=>{try{localStorage.setItem('rk4',JSON.stringify({mode,sel:[...sel]}))}catch(e){}};
const pool=()=>{const seen=new Set();return WORDS.filter(w=>w.c.some(c=>sel.has(c))).filter(w=>{const k=w.tr.toLowerCase()+'|'+norm(w.ru);if(seen.has(k))return false;seen.add(k);return true})};
const answers=w=>{const s=new Set();WORDS.filter(x=>x.tr.toLowerCase()===w.tr.toLowerCase()).forEach(x=>{s.add(norm(x.ru));x.ru.split('/').forEach(p=>s.add(norm(p)))});s.delete('');return s};

fetch('kelimeler.html').then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{
  const d=JSON.parse(t.match(/<script type="application\/json" id="data">([\s\S]*?)<\/script>/)[1]);
  WORDS=d.words;CATS=d.cats;
  RULES=new Function('return '+t.match(/const RULES = (\[[\s\S]*?\n\]);/)[1])();
  boot();
}).catch(()=>{$('#stage').innerHTML='Kelimeler yüklenemedi. <b>kelimeler.html</b> dosyası index.html ile aynı klasörde mi? Ayrıca siteyi GitHub Pages adresinden aç, dosyaya çift tıklayıp değil.'});

function boot(){
  CATS.forEach(c=>sel.add(c.id));ruleId=RULES[0].id;
  try{const s=JSON.parse(localStorage.getItem('rk4')||'{}');if(s.mode&&TABS.some(t=>t[0]===s.mode))mode=s.mode;if(Array.isArray(s.sel)&&s.sel.length){sel.clear();s.sel.forEach(x=>sel.add(x))}}catch(e){}
  $('#nav').innerHTML=TABS.map(t=>`<button data-m="${t[0]}">${t[1]}</button>`).join('');
  $('#nav').onclick=e=>{const b=e.target.closest('button');if(b){mode=b.dataset.m;save();start();scrollTo(0,0)}};
  $('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.c){sel.has(b.dataset.c)?sel.delete(b.dataset.c):sel.add(b.dataset.c)}
    else{const g=b.dataset.all||b.dataset.none;CATS.filter(c=>c.g===g).forEach(c=>b.dataset.all?sel.add(c.id):sel.delete(c.id))}
    save();start()};
  start();
}
function chips(){
  const gs=[...new Set(CATS.map(c=>c.g))];
  $('#chips').innerHTML=gs.map(g=>`<div class="sm">${esc(g)} · <button data-all="${esc(g)}"><u>hepsi</u></button> <button data-none="${esc(g)}"><u>hiçbiri</u></button></div><div class="chips">`+
    CATS.filter(c=>c.g===g).map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${sel.has(c.id)}">${esc(c.n)}</button>`).join('')+'</div>').join('');
  $('#cnt').textContent='· '+pool().length+' kelime';
}
function start(){
  document.querySelectorAll('#nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.m===mode));
  $('#filter').hidden=mode==='rules';chips();
  const needsPool=!(mode==='rules'||(mode==='test'&&kind!=='word'));
  if(needsPool&&!pool().length){$('#stage').innerHTML='<p class="sm">Önce en az bir konu seç.</p>';return}
  ({write:writeInit,cards:cardsInit,test:testInit,match:matchInit,rules:rulesInit,list:listInit})[mode]();
}

/* ---- YAZMA ---- */
let W;
function writeInit(){const q=shuffle(pool()).map(w=>({w,need:1,miss:false}));W={q,total:q.length,learned:0,tries:0,right:0,state:'ask',shown:q[0],given:''};writeDraw()}
function writeJudge(t){
  const cur=W.shown,ok=t!==null&&answers(cur.w).has(norm(t));W.tries++;W.q.shift();
  if(ok){W.right++;cur.need--;if(cur.need>0)W.q.splice(Math.min(5,W.q.length),0,cur);else W.learned++;W.state='right'}
  else{cur.need=2;cur.miss=true;W.q.splice(Math.min(3,W.q.length),0,cur);W.state='wrong';W.given=t||''}
  writeDraw()}
function writeNext(){W.state='ask';W.shown=W.q[0];writeDraw()}
function writeDraw(){
  const st=$('#stage');
  if(!W.shown){st.innerHTML=`<div class="q"><div class="big">Hepsini öğrendin</div><p>${W.total} kelime · ${W.right} doğru, ${W.tries-W.right} yanlış cevap</p><button class="btn p" id="again">Yeniden başla</button></div>`;$('#again').onclick=writeInit;return}
  const cur=W.shown,w=cur.w,cat=CATS.find(c=>w.c.includes(c.id));
  const head=`<div class="prog"><b style="width:${W.learned/W.total*100}%"></b></div><div class="meta"><span>${W.learned}/${W.total} öğrenildi · ${W.q.length} kaldı</span><span>Doğru ${W.right} · Yanlış ${W.tries-W.right}</span></div>`;
  const prompt=`<div class="q"><div class="sm">Rusçası nedir?</div><div class="big">${esc(w.tr)}</div>${cat?`<div class="sm">${esc(cat.n)}</div>`:''}${cur.miss&&W.state==='ask'?'<div class="sm">Tekrar: bunu daha önce yanlış yaptın</div>':''}</div>`;
  const inp=(id,ph)=>`<input class="win" id="${id}" lang="ru" placeholder="${ph}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
  if(W.state==='ask'){
    st.innerHTML=head+prompt+inp('ans','Rusçasını yaz')+`<div class="row"><button class="btn" id="skip">Bilmiyorum</button><button class="btn p" id="chk">Kontrol et</button></div><p class="sm" style="margin-top:12px">ё yerine е yazabilirsin, vurgu işareti gerekmez.</p>`;
    const a=$('#ans');setTimeout(()=>a.focus(),30);
    a.onkeydown=e=>{if(e.key==='Enter'&&a.value.trim())writeJudge(a.value)};
    $('#chk').onclick=()=>{a.value.trim()?writeJudge(a.value):a.focus()};
    $('#skip').onclick=()=>writeJudge(null);
  }else if(W.state==='right'){
    st.innerHTML=head+prompt+`<div class="fb"><b>✓ Doğru.</b> ${esc(w.ru)} (${esc(w.pr)}) = ${esc(w.tr)}${w.note?'<br>'+esc(w.note):''}</div><button class="btn p" id="next" style="width:100%">Sonraki</button>`;
    $('#next').onclick=writeNext;$('#next').focus();
  }else{
    st.innerHTML=head+prompt+`<div class="fb no"><b>✗ Yanlış.</b> ${W.given?'Senin cevabın: '+esc(W.given)+'<br>':''}Doğrusu: <b>${esc(w.ru)}</b> (${esc(w.pr)})${w.note?'<br>'+esc(w.note):''}</div><p class="sm">Doğrusunu yazarak devam et. Bu kelime birazdan tekrar gelecek.</p>`+inp('fix','Doğrusunu yaz')+`<button class="btn p" id="go" style="width:100%">Devam</button>`;
    const f=$('#fix');setTimeout(()=>f.focus(),30);
    const go=()=>{if(answers(w).has(norm(f.value)))writeNext();else{f.value='';f.placeholder='Tam olarak doğrusunu yaz';f.focus()}};
    f.onkeydown=e=>{if(e.key==='Enter')go()};$('#go').onclick=go;
  }
}

/* ---- KARTLAR ---- */
let C;
function cardsInit(){const d=shuffle(pool());C={d,total:d.length,known:0,flip:false};cardsDraw()}
function cardsDraw(){
  const st=$('#stage');
  if(!C.d.length){st.innerHTML=`<div class="q"><div class="big">Deste bitti</div><button class="btn p" id="again">Yeniden başla</button></div>`;$('#again').onclick=cardsInit;return}
  const w=C.d[0];
  st.innerHTML=`<div class="prog"><b style="width:${C.known/C.total*100}%"></b></div><div class="meta"><span>${C.known} bildim</span><span>${C.d.length} kaldı</span></div>
  <button class="q" id="card" style="width:100%;min-height:220px;justify-content:center;border:1px solid var(--line);border-radius:18px;margin-bottom:12px">${C.flip?`<div class="big">${esc(w.tr)}</div><div class="pron">${esc(w.pr)}</div>${w.note?`<div class="sm">${esc(w.note)}</div>`:''}`:`<div class="big">${esc(w.ru)}</div><div class="pron">${esc(w.pr)}</div><div class="sm">çevirmek için dokun</div>`}</button>
  <div class="row"><button class="btn" id="no">Bilmedim</button><button class="btn p" id="yes">Bildim</button></div>`;
  $('#card').onclick=()=>{C.flip=!C.flip;cardsDraw()};
  $('#yes').onclick=()=>{C.d.shift();C.known++;C.flip=false;cardsDraw()};
  $('#no').onclick=()=>{C.d.push(C.d.shift());C.flip=false;cardsDraw()};
}

/* ---- TEST (kelime / cinsiyet / çoğul) ---- */
let T;
const GEN=['Eril','Dişil','Nötr'];
const gW=()=>WORDS.filter(w=>/^(Eril|Dişil|Nötr)/.test(w.note)&&!/fiil/.test(w.note)&&!/\s/.test(w.ru));
const pW=()=>WORDS.filter(w=>/^Tekil: .+ · .+$/.test(w.note)&&!/[ \/]/.test(w.ru));
function qWord(w){
  const toRu=Math.random()<.5,key=toRu?'ru':'tr',opts=[w];
  for(const x of shuffle(WORDS)){if(opts.length>=4)break;if(x.tr.toLowerCase()!==w.tr.toLowerCase()&&!opts.some(o=>norm(o[key])===norm(x[key])))opts.push(x)}
  return{sh:1,p:`<div class="big">${esc(w[toRu?'tr':'ru'])}</div>${toRu?'':`<div class="pron">${esc(w.pr)}</div>`}`,o:opts.map(o=>({ok:o===w,h:esc(o[key])})),e:`${esc(w.ru)} (${esc(w.pr)}) = ${esc(w.tr)}`,w};
}
function qGender(w){
  const g=w.note.match(/^(Eril|Dişil|Nötr)/)[1];
  return{sh:0,p:`<div class="sm">Cinsiyeti hangisi?</div><div class="big">${esc(w.ru)}</div><div class="sm">${esc(w.pr)} · ${esc(w.tr)}</div>`,o:GEN.map(x=>({ok:x===g,h:x})),e:`${esc(w.ru)} = ${g}. ${esc(w.note)}`,w};
}
function qPlural(w){
  const m=w.note.match(/^Tekil: (.+?) · (.+)$/),sing=m[1],base=sing.replace(/\s*\(.*\)/,''),c=w.ru,wr=new Set();
  ['ы','и','а','я','е'].forEach(a=>wr.add(c.slice(0,-1)+a));['ы','и','а'].forEach(a=>wr.add(base+a));
  if(/ья$/.test(c)){wr.add(c.replace(/ья$/,'ы'));wr.add(c.replace(/ья$/,'и'))}
  wr.delete(c);wr.delete(base);const wrong=shuffle([...wr]).slice(0,3);
  return{sh:1,p:`<div class="sm">Çoğulu hangisi?</div><div class="big">${esc(sing)}</div><div class="sm">çoğul anlamı: ${esc(w.tr)}</div>`,o:[{ok:true,h:esc(c)}].concat(wrong.map(x=>({ok:false,h:esc(x)}))),e:`${esc(sing)} → ${esc(c)} (${esc(w.pr)}). Kural: ${esc(m[2])}`,w};
}
function testInit(){
  const names={word:'Kelime',gender:'Cinsiyet',plural:'Çoğul'};
  $('#stage').innerHTML=`<div class="q"><div class="big">Test</div><div class="row">${Object.keys(names).map(k=>`<button class="btn ${k===kind?'p':''}" data-k="${k}">${names[k]}</button>`).join('')}</div>
  <p class="sm">${{word:'Seçili konulardan 4 şıklı kelime sorusu.',gender:'Kelimenin eril, dişil veya nötr olduğunu bul.',plural:'Doğru çoğul biçimini seç.'}[kind]}</p><button class="btn p" id="go" style="width:100%">20 soruluk test başlat</button></div>`;
  $('#stage').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;start()});
  $('#go').onclick=()=>{
    const src=kind==='word'?pool():kind==='gender'?gW():pW(),fn={word:qWord,gender:qGender,plural:qPlural}[kind];
    runTest(shuffle(src).slice(0,20).map(fn));
  };
}
function runTest(qs){T={qs:qs.map(q=>({...q,o:q.sh?shuffle(q.o):q.o})),i:0,score:0,a:null,wrong:[]};testDraw()}
function testDraw(){
  const st=$('#stage');
  if(T.i>=T.qs.length){st.innerHTML=`<div class="q"><div class="big">${T.score}/${T.qs.length}</div>${T.wrong.length?`<div class="tw" style="width:100%"><table>${T.wrong.map(q=>`<tr><td class="r">${esc(q.w.ru)}</td><td>${esc(q.w.pr)} · ${esc(q.w.tr)}</td></tr>`).join('')}</table></div>`:''}
    <div class="row" style="width:100%">${T.wrong.length?'<button class="btn" id="redo">Yanlışları tekrar et</button>':''}<button class="btn p" id="again">Yeni test</button></div></div>`;
    const r=$('#redo');if(r)r.onclick=()=>runTest(T.wrong.slice());$('#again').onclick=testInit;return}
  const q=T.qs[T.i],a=T.a;
  st.innerHTML=`<div class="prog"><b style="width:${T.i/T.qs.length*100}%"></b></div><div class="meta"><span>Soru ${T.i+1}/${T.qs.length}</span><span>Skor ${T.score}</span></div>
  <div class="q">${q.p}</div>
  <div class="opts">${q.o.map((o,k)=>`<button class="opt${a!==null?(o.ok?' ok':k===a?' bad':''):''}" data-k="${k}" ${a!==null?'disabled':''}>${o.h}</button>`).join('')}</div>
  ${a!==null?`<div class="fb"><b>${q.o[a].ok?'✓ Doğru.':'✗ Yanlış.'}</b> ${q.e}</div><button class="btn p" id="next" style="width:100%">Sonraki</button>`:''}`;
  st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(T.a!==null)return;T.a=+b.dataset.k;if(q.o[T.a].ok)T.score++;else T.wrong.push(q);testDraw()});
  const n=$('#next');if(n){n.onclick=()=>{T.i++;T.a=null;testDraw()};n.focus()}
}

/* ---- EŞLEŞTİRME ---- */
let M;
function matchInit(){
  const sr=new Set(),stt=new Set();
  const list=shuffle(pool()).filter(w=>{const t=w.tr.toLowerCase();if(sr.has(w.ru)||stt.has(t))return false;sr.add(w.ru);stt.add(t);return true});
  M={list,r:0,mis:0,total:0};matchRound();
}
function matchRound(){
  const part=M.list.slice(M.r*6,M.r*6+6);
  if(!part.length){$('#stage').innerHTML=`<div class="q"><div class="big">Hepsi eşleşti</div><p>${M.total} kelime · ${M.mis} hata</p><button class="btn p" id="again">Yeniden oyna</button></div>`;$('#again').onclick=matchInit;return}
  M.part=part;M.L=shuffle(part);M.R=shuffle(part);M.ok=new Set();M.pick=null;matchDraw();
}
function matchDraw(){
  const rounds=Math.ceil(M.list.length/6);
  const L=M.L.map((w,i)=>`<button class="m ${M.ok.has(w)?'done':''} ${M.pick&&M.pick.s==='l'&&M.pick.i===i?'sel':''}" data-s="l" data-i="${i}"><b>${esc(w.ru)}</b><br><span class="sm">${esc(w.pr)}</span></button>`).join('');
  const R=M.R.map((w,i)=>`<button class="m ${M.ok.has(w)?'done':''} ${M.pick&&M.pick.s==='r'&&M.pick.i===i?'sel':''}" data-s="r" data-i="${i}">${esc(w.tr)}</button>`).join('');
  $('#stage').innerHTML=`<div class="prog"><b style="width:${M.r/rounds*100}%"></b></div><div class="meta"><span>Tur ${M.r+1}/${rounds}</span><span>Hata ${M.mis}</span></div>
  <p class="sm">Soldaki Rusça kelimeyi sağdaki Türkçe karşılığıyla eşleştir.</p><div class="mgrid"><div class="mcol">${L}</div><div class="mcol">${R}</div></div>`;
  $('#stage').querySelectorAll('.m').forEach(b=>b.onclick=()=>matchTap(b.dataset.s,+b.dataset.i));
}
function matchTap(s,i){
  if(!M.pick||M.pick.s===s){M.pick={s,i};matchDraw();return}
  const l=s==='l'?i:M.pick.i,r=s==='r'?i:M.pick.i;M.pick=null;
  if(M.L[l]===M.R[r]){M.ok.add(M.L[l]);if(M.ok.size===M.part.length){M.total+=M.part.length;matchDraw();setTimeout(()=>{M.r++;matchRound()},500);return}}
  else M.mis++;
  matchDraw();
}

/* ---- KURALLAR ---- */
const lookup=r=>Array.isArray(r)?{ru:r[0],pr:r[1],tr:r[2],note:r[3]||''}:(WORDS.find(w=>w.ru===r)||{ru:r,pr:'',tr:'',note:''});
function block(b){
  if(b.t==='p')return `<p>${esc(b.x)}</p>`;
  if(b.t==='tip')return `<div class="tip">${esc(b.x)}</div>`;
  if(b.t==='tbl')return `<div class="tw"><table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.t==='ex')return `<div class="tw"><table><thead><tr><th>Rusça</th><th>Okunuş</th><th>Türkçe</th><th>Not</th></tr></thead><tbody>${b.rows.map(lookup).map(w=>`<tr><td class="r">${esc(w.ru)}</td><td class="p">${esc(w.pr)}</td><td>${esc(w.tr)}</td><td class="sm">${esc(w.note)}</td></tr>`).join('')}</tbody></table></div>`;
  return '';
}
function rulesInit(){
  const gs=[...new Set(RULES.map(r=>r.g))],r=RULES.find(x=>x.id===ruleId)||RULES[0],i=RULES.indexOf(r);
  const idx=gs.map(g=>`<div class="sm">${esc(g)}</div><div class="chips">${RULES.filter(x=>x.g===g).map(x=>`<button class="chip" data-r="${x.id}" aria-pressed="${x.id===r.id}">${esc(x.t)}</button>`).join('')}</div>`).join('');
  const prev=RULES[i-1],next=RULES[i+1];
  $('#stage').innerHTML=idx+`<h2>${esc(r.t)}</h2>`+r.b.map(block).join('')+
    `<div class="row" style="margin-top:16px">${r.quiz?`<button class="btn p" id="rq">${r.quiz==='gender'?'Cinsiyet testi çöz':'Çoğul testi çöz'}</button>`:''}${prev?`<button class="btn" data-r="${prev.id}">← ${esc(prev.t)}</button>`:''}${next?`<button class="btn" data-r="${next.id}">${esc(next.t)} →</button>`:''}</div>`;
  $('#stage').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ruleId=b.dataset.r;rulesInit();scrollTo(0,0)});
  const q=$('#rq');if(q)q.onclick=()=>{kind=r.quiz;mode='test';save();start();scrollTo(0,0)};
}

/* ---- LİSTE ---- */
function listInit(){
  $('#stage').innerHTML=`<input type="search" id="q" placeholder="Rusça, okunuş veya Türkçe ara" autocomplete="off"><div class="tw"><table><thead><tr><th>Rusça</th><th>Okunuş</th><th>Türkçe</th><th>Not</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw=()=>{const q=$('#q').value.trim().toLowerCase();
    $('#tb').innerHTML=pool().filter(w=>!q||(w.ru+' '+w.pr+' '+w.tr).toLowerCase().includes(q)).map(w=>`<tr><td class="r">${esc(w.ru)}</td><td class="p">${esc(w.pr)}</td><td>${esc(w.tr)}</td><td class="sm">${esc(w.note)}</td></tr>`).join('')};
  $('#q').oninput=draw;draw();
}
</script></body></html>
